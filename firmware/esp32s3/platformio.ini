[platformio]
default_envs = fsr_monitor

[env]
; Pinned to the Espressif platform available on this development machine.
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
; Connected board verified by esptool: 16 MB quad-SPI flash. No PSRAM used.
; Keep the conservative default.csv partition layout (uses the first 4 MB).
board_upload.flash_size = 16MB
board_build.partitions = default.csv
monitor_speed = 115200
build_unflags = -std=gnu++11 -DARDUINO_USB_MODE=1
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
extra_scripts = pre:shared_codec.py
build_src_filter = +<*> -<simple_erm.cpp> -<adafruit_erm.cpp>

[env:fsr_monitor]
build_flags = ${env.build_flags} -DMIXSENSE_FSR_MONITOR=1

[env:mixsense_usb]
build_flags = ${env.build_flags} -DMIXSENSE_FSR_MONITOR=0

[env:hardware_check]
; Text-only FSR + DRV2605L identification. Never starts actuator playback.
build_flags = ${env.build_flags} -DMIXSENSE_FSR_MONITOR=1 -DMIXSENSE_I2C_CHECK=1

[env:erm_test]
; Text commands 1/2/3: bounded 500ms ERM tests. No vibration until a command.
build_flags = ${env.build_flags} -DMIXSENSE_FSR_MONITOR=0 -DMIXSENSE_ENABLE_ERM=1 -DMIXSENSE_MOTOR_TEST=1

[env:mixsense_erm]
; Binary MixSense protocol plus real 3V ERM output. Keep mixsense_usb receive-only.
build_flags = ${env.build_flags} -DMIXSENSE_FSR_MONITOR=0 -DMIXSENSE_ENABLE_ERM=1

[env:mixsense_gr_erm]
; Combined FSR + v1 binary protocol + proven Adafruit ERM initialization.
; Increasing pressure lowers threshold. Motor output capped at RTP 90.
build_flags = ${env.build_flags} -DMIXSENSE_FSR_MONITOR=0 -DMIXSENSE_ENABLE_ERM=1 -DMIXSENSE_ADAFRUIT_ERM=1 -DMIXSENSE_FSR_INVERT=1
lib_deps =
    adafruit/Adafruit DRV2605 Library@1.2.4
    adafruit/Adafruit BusIO@1.17.4

[env:simple_erm]
; Independent minimal sketch: type 1 for one second, 0 to stop.
build_flags = ${env.build_flags}
build_src_filter = -<*> +<simple_erm.cpp>
extra_scripts =

[env:mixsense_gr_erm_debug]
; Diagnostic-only mixed USB stream: v1 packets plus DBG text, no auto vibration.
extends = env:mixsense_gr_erm
build_flags = ${env:mixsense_gr_erm.build_flags} -DMIXSENSE_GR_DIAGNOSTIC=1

[env:adafruit_erm]
; User's known-working Adafruit initialization and realtime levels.
build_flags = ${env.build_flags}
build_src_filter = -<*> +<adafruit_erm.cpp>
extra_scripts =
lib_deps =
    adafruit/Adafruit DRV2605 Library@1.2.4
    adafruit/Adafruit BusIO@1.17.4
